}
@media (prefers-color-scheme: dark) {

}

}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.75; -webkit-text-size-adjust: 100%; }

.qtext { font-size: 1.05rem; white-space: pre-wrap; }

textarea.short { min-height: 4.5rem; }

.hint { font-size: .85rem; color: var(--muted); }
.msg { font-size: .9rem; color: var(--warn); }
.ok-msg { font-size: .9rem; color: var(--ok); }

.panel { border-top: 1px solid var(--rule); padding-top: .9rem; display: flex; flex-direction: column; gap: .7rem; }

.key dd { margin: 0; }
.scores { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .5rem; }
.scores .btn { min-height: 3.2rem; display: flex; flex-direction: column; justify-content: center; line-height: 1.3; }
.scores .btn b { font-variant-numeric: tabular-nums; }
.scores .btn span { font-size: .78rem; color: var(--muted); }
.grade { display: flex; align-items: baseline; flex-wrap: wrap; gap: .55rem; }
.grade .score { font-family: var(--f-display); font-weight: 900; font-size: 2.4rem; line-height: 1; font-variant-numeric: tabular-nums; }
.grade .verdict { font-size: .82rem; padding: .05rem .55rem; border-radius: 999px; }
.grade.pass .score { color: var(--ok); }
.grade.pass .verdict { background: var(--ok-tint); color: var(--ok); }
.grade.fail .score { color: var(--warn); }
.grade.fail .verdict { background: var(--warn-tint); color: var(--warn); }
.mine summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
.mine p { white-space: pre-wrap; margin-top: .4rem; color: var(--muted); }

.summary { list-style: none; margin: 0; padding: 0; display: grid; gap: .35rem; }
.summary li { display: flex; justify-content: space-between; gap: 1rem; border-bottom: 1px solid var(--rule); padding-block: .35rem; }
.summary b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.field-label { font-size: .92rem; font-weight: 600; }
.cheat { display: flex; flex-direction: column; gap: .8rem; }
.cheat h2 { font-size: 1.35rem; }
.cheat h3 { font-size: 1.02rem; margin-top: .3rem; }
.cheat ul, .cheat ol { margin: 0; padding-left: 1.2em; display: grid; gap: .3rem; }
.one { font-family: var(--f-display); font-weight: 600; font-size: 1.08rem; }
.foot { font-size: .8rem; color: var(--muted); border-top: 1px solid var(--rule); padding-top: .9rem; display: flex; flex-direction: column; gap: .4rem; }
.linkish { appearance: none; border: 0; background: none; color: var(--muted); text-decoration: underline; padding: 0; font-size: .8rem; }
</style>
</head>

        text: "一家奶茶店今年账面利润 30 万，可年底一看，银行里的钱反而比年初少了 10 万。钱去哪了？能想到几种可能就说几种。先别查资料，用自己的话答。",
        key: "答出至少 3 种、分属不同类别的原因 → 7 分起；经营、投资、筹资三栏都覆盖 → 9–10 分。经营：钱没收回来（应收、外卖平台结算慢）、压在货上（存货）、预付了房租、还了以前欠的货款（应付减少）；投资：买设备、装修、开新店；筹资：还借款本金、老板分红或取钱。点出「利润按权责发生制记、现金按实际收付记」这个根，加 1 分（满分封顶 10）。",
        errors: "答「被偷了 / 算错了」，不在账的逻辑上；把还利息和还本金混在一起（利息进利润表，本金不进）；以为折旧会让现金比利润少（正好反了）。" },
      { id: "L1-Q2", primer: { t: "现金流量表的三栏", p: ["现金流量表把所有进出的钱分成三栏。", "经营活动：做生意本身带来的进出。卖货收的钱、付给供应商的货款、发的工资、交的房租，都在这一栏。", "投资活动：为以后做生意花的长期的钱。买设备、装修、开新店；卖掉旧设备收回来的钱也算这一栏。", "筹资活动：和出钱的人之间的往来。借钱进来、还贷款本金、股东投钱进来、给股东分红。借款的利息算费用，进利润表；本金不是费用，只在筹资栏。", "判断口诀：跟日常买卖有关的进经营，跟长期家当有关的进投资，跟债主和股东有关的进筹资。"] }, kind: "归栏", title: "放进三栏",
        text: "把你刚才说的每种可能，放进现金流量表的三栏：经营活动、投资活动、筹资活动。上一题没想到的，也可以在这里补。",

      { id: "L1-Q3", hint: "这题不用新知识，用前两段讲解推一推。", kind: "反过来", title: "利润为零，钱却多了",
        text: "另一家店账面利润是 0，银行里的钱却多了 50 万。可能吗？说两种情况。",
        key: "可能。折旧摊销大（利润里扣了，现金没出去）；卖储值卡、会员卡（预收）；拖着供应商的钱（应付增加）；借了钱；卖了设备；股东注资。至少 2 种对、其中至少 1 种是经营性的（折旧、预收或应付）才能 7 分以上；只说借钱、注资这类筹资原因最多 6 分。",

      { id: "L1-Q5", primer: { t: "自由现金流", p: ["经营现金流是做生意本身带进来的钱。可生意要维持、要长大，就得不断花钱买设备、开新店，这笔钱叫资本开支。", "自由现金流（入门版）= 经营现金流 − 资本开支。剩下这部分，是股东拿走了也不伤生意的钱。", "巴菲特 1986 年致股东信里有个相近的概念，叫「所有者收益」，他把它看得比会计上的净利润更重。", "为什么它比净利润更靠得住？这一题你来说。"] }, kind: "费曼", title: "自由现金流",

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const fmt = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => fmt(new Date());
const addDays = (iso, n) => { const [y, m, d] = iso.split("-").map(Number); return fmt(new Date(y, m - 1, d + n)); };

const att = id => D.attempts[id] || null;
const lastAnswer = id => { const a = att(id); return a && a.answers && a.answers.length ? a.answers[a.answers.length - 1] : null; };
const firstScore = id => { const a = att(id); const g = a && a.answers ? a.answers.filter(x => typeof x.score === "number") : []; return g.length ? g[0].score : null; };
function qStatus(q) { const la = lastAnswer(q.id); if (!la) return "todo"; return typeof la.score === "number" ? "graded" : "pending"; }
const isDone = q => firstScore(q.id) !== null || !!(q.optional && att(q.id) && att(q.id).skipped);
const lessonDone = L => !!D.done[L.id];
const unlocked = L => !L.after || lessonDone(lessonOf(L.after));
const nextIndex = L => { const i = L.questions.findIndex(q => !isDone(q)); return i < 0 ? "close" : i; };
function summaryOf(L) {
  const req = L.questions.filter(q => !q.optional);
  const scored = req.filter(q => firstScore(q.id) !== null);
  const avg = scored.length ? scored.reduce((s, q) => s + firstScore(q.id), 0) / scored.length : null;
  let passed = avg !== null && avg >= L.passAvg;
  if (L.mustPass) passed = passed && L.mustPass.every(id => (firstScore(id) ?? 0) >= PASS);
  return { req, avg, passed };
}
const reviewedToday = () => Object.values(D.review).filter(r => (r.记录 || []).some(x => x.日期 === today())).length;
function reviewQueue() {
  const t = today();

    .sort((a, b) => a.下次到期 < b.下次到期 ? -1 : a.下次到期 > b.下次到期 ? 1 : (a.id < b.id ? -1 : 1));
  return due.slice(0, Math.max(0, MAX_REVIEW_PER_DAY - reviewedToday()));
}

async function copyText(text) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch (e) {}
  try {
    const t = document.createElement("textarea"); t.value = text; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.top = "-1000px";
    document.body.appendChild(t); t.select(); t.setSelectionRange(0, text.length); const ok = document.execCommand("copy"); t.remove(); return ok;
  } catch (e) { return false; }
}

      (V.revising[q.id] ? '<button class="btn" data-act="cancel-revise" data-id="' + esc(q.id) + '">不改了</button>' : "") +
      (q.optional && st === "todo" ? '<button class="btn" data-act="skip-opt" data-id="' + esc(q.id) + '">跳过，去收尾</button>' : "") + "</div>";
  } else if (st === "pending") {
    h += '<details class="mine" open><summary>你的回答</summary><p>' + esc(la.text) + "</p></details>" + checkPanel(q.id, q, la.text) +
      '<div class="row"><button class="btn small" data-act="revise" data-id="' + esc(q.id) + '">改一改回答</button></div>';
  } else {
    const n = la.score; const f = firstScore(q.id);
    h += '<details class="mine"><summary>你的回答</summary><p>' + esc(la.text) + "</p></details>" + gradeHtml(n) +
      (f !== null && f !== n ? '<p class="hint">首答 ' + esc(f) + " 分，算成绩和排复习用首答。</p>" : "") +
      '<div class="row"><button class="btn primary" data-act="next">下一题</button><button class="btn" data-act="revise" data-id="' + esc(q.id) + '">再答一次</button></div>' +
      '<details class="mine"' + (V.copied["g-" + q.id] !== undefined ? " open" : "") + '><summary>还想让 AI 再讲讲</summary><div style="margin-top:.6rem">' + promptBlock("g-" + q.id, gradePrompt({ text: q.text, key: q.key, errors: q.errors, answer: la.text }), "复制考官提示词") + "</div></details>";
  }
  if (V.msg[q.id]) h += '<p class="msg">' + esc(V.msg[q.id]) + "</p>";
  return h + "</article>";
}
function reviewCard(item, n) {
  const key = "rv-" + item.id; const shown = V.rvShown === item.id;
  let h = '<article class="card"><div class="card-head"><span class="qno">复习 · 今天还有 ' + n + ' 题</span><span class="chip">第 ' + esc(item.课) + " 课</span></div><p class=\"qtext\">" + esc(item.题) + "</p>";
  if (!shown) h += ta(key, "凭记忆答，别翻速查表。") + '<div class="row"><button class="btn primary" data-act="rv-submit" data-id="' + esc(item.id) + '">交卷</button></div>';
  else {
    const ans = D.drafts[key] || "";
    h += '<details class="mine" open><summary>你的回答</summary><p>' + esc(ans) + "</p></details>" +
      '<div class="panel"><h3>批改：二选一</h3>' + promptBlock("r-" + item.id, gradePrompt({ text: item.题, key: item.要点, answer: ans }), "复制考官提示词") +
      '<details class="mine"><summary>自己对照要点打分</summary><div class="key" style="margin-top:.6rem"><p>' + esc(item.要点) + "</p></div></details>" +
      '<p class="field-label">这题你得几分？</p>' + scoreButtons("rv:" + item.id) + "</div>";
  }
  return h + "</article>";
}
function closeCard(L) {
  const sum = summaryOf(L);
  let h = '<article class="card"><div class="card-head"><span class="qno">收尾</span></div><h2 class="qtitle">这节课答完了</h2><ul class="summary">' +
    sum.req.map(q => "<li><span>第 " + (q.order + 1) + " 题 · " + esc(q.title) + "</span><b>" + (firstScore(q.id) !== null ? firstScore(q.id) + " 分" : "没打分") + "</b></li>").join("") +
    "</ul><p>" + (sum.avg === null ? "" : "平均 " + (Math.round(sum.avg * 10) / 10) + " 分，" + (sum.passed ? "过了。" : "没过，没到 7 分的题明天复习时再考。")) + "</p>" +
    '<label class="field-label" for="note-fp-' + esc(L.id) + '">复盘：今天哪个说法，你原来以为对，其实是错的？</label>' + ta("note-fp-" + L.id, "一两句就行。", "short");
  if (L.bigPicture) h += '<label class="field-label" for="note-big-' + esc(L.id) + '">画一张大图（不打分）：不看资料，用自己的话说，价值投资从「要不要买一家公司」到「什么时候卖」，要依次回答哪几个问题？</label>' + ta("note-big-" + L.id, "想到几步写几步，留作以后对照。");
  return h + '<div class="row"><button class="btn primary" data-act="close" data-id="' + esc(L.id) + '">收尾，排进复习</button></div><p class="hint">收尾后出速查表，' + L.selftest.length + " 道自测题和没过的题明天开始复习。</p></article>";
}
function doneView(L) {
  const sum = summaryOf(L); const c = L.cheat; const li = xs => xs.map(x => "<li>" + esc(x) + "</li>").join("");
  const next = LESSONS[LESSONS.indexOf(L) + 1];
  return '<article class="card"><div class="card-head"><span class="qno">已完成 · ' + esc(D.done[L.id].at || "") + "</span></div><p>" +
    (sum.avg === null ? "" : "平均 " + (Math.round(sum.avg * 10) / 10) + " 分，" + (sum.passed ? "过了。" : "没过，没到 7 分的题在复习里再考。")) + "点上面的数字可以回看每一题。</p>" +
    (next ? '<div class="row"><button class="btn primary" data-act="tab" data-id="' + esc(next.id) + '">去第 ' + esc(next.num) + " 课</button></div>" : '<p class="hint">后面的课做好一节上线一节。</p>') + "</article>" +
    '<article class="card cheat"><h2>速查表</h2><p class="one">' + esc(c.one) + "</p><h3>核心概念</h3><ul>" + li(c.concepts) + "</ul><h3>常见错误</h3><ul>" + li(c.mistakes) +
    "</ul><h3>用之前查一遍</h3><ul>" + li(c.checklist) + "</ul><h3>自测题（已排进复习）</h3><ol>" + li(L.selftest.map(s => s.q)) + "</ol></article>";
}
function render() {
  const ae = document.activeElement; const keep = ae && ae.tagName === "TEXTAREA" && ae.id ? ae.id : null;
  document.getElementById("tabs").innerHTML = renderTabs();
  const L = lessonOf(V.lessonId); const queue = reviewQueue(); let h = "";
  if (queue.length) h = '<section class="lesson-head"><p class="eyebrow">复习</p><h1>先考旧题</h1><p class="lead">每次打开先考到期的旧题，一次一题。答对了隔得越来越久再考，答错了明天再来。</p></section>' + reviewCard(queue[0], queue.length);
  else if (!unlocked(L)) {
    const pre = lessonOf(L.after);
    h = '<section class="lesson-head"><p class="eyebrow">第 ' + esc(L.num) + " 课 · " + esc(L.tag) + "</p><h1>" + esc(L.title) + '</h1><p class="lead">' + esc(L.lead) + '</p></section><article class="card"><p>这节课在第 ' + esc(pre.num) + ' 课收尾之后开。</p><div class="row"><button class="btn primary" data-act="tab" data-id="' + esc(pre.id) + '">回第 ' + esc(pre.num) + " 课</button></div></article>";
  } else {
    const auto = nextIndex(L); const cur = V.pick !== null ? V.pick : (lessonDone(L) ? null : auto);
    h = '<section class="lesson-head"><p class="eyebrow">第 ' + esc(L.num) + " 课 · " + esc(L.tag) + "</p><h1>" + esc(L.title) + '</h1><p class="lead">' + esc(L.lead) + "</p>" +
      '<details class="mine"' + (V.copied["lesson-" + L.id] !== undefined ? " open" : "") + '><summary>想让你自己的 AI 从头带你上这节课？</summary><div style="margin-top:.6rem;display:flex;flex-direction:column;gap:.6rem"><p class="hint">复制下面这段，粘到 ChatGPT、Claude、豆包、DeepSeek 或 Kimi 里，它会一题一题讲、一题一题考。也可以就在这页上答。</p>' +
      promptBlock("lesson-" + L.id, lessonPrompt(L), "复制整节课的考官提示词") + "</div></details>" +
      '<div class="dots" role="group" aria-label="本课题目">' +
      L.questions.map((q, i) => { const st = qStatus(q); const f = firstScore(q.id); const cls = "dot" + (f !== null ? (f >= PASS ? " pass" : " fail") : st === "pending" ? " pending" : "") + (i === cur ? " cur" : "");
        return '<button class="' + cls + '" data-act="pick" data-i="' + i + '" aria-label="第 ' + (i + 1) + ' 题">' + (i + 1) + "</button>"; }).join("") +
      '<button class="dot' + (cur === "close" || cur === null ? " cur" : "") + '" data-act="pick" data-i="end">' + (lessonDone(L) ? "速查" : "收尾") + "</button></div></section>";
    if (typeof cur === "number") h += questionCard(L, cur);
    else if (lessonDone(L)) h += doneView(L);
    else h += closeCard(L);
  }
  document.getElementById("stage").innerHTML = h;
  if (keep) { const el = document.getElementById(keep); if (el) el.focus(); }
}
function record(target, n) {
  if (target.startsWith("rv:")) {
    const id = target.slice(3); const r = D.review[id]; if (!r) return;
    const passed = n >= PASS; r.记录 = (r.记录 || []).concat([{ 日期: today(), 分: n, 档: r.档 }]);
    if (passed && r.档 === GAPS.length - 1) { r.状态 = "毕业"; r.下次到期 = null; }
    else { r.档 = passed ? r.档 + 1 : 0; r.下次到期 = addDays(today(), GAPS[r.档]); }
    delete D.drafts["rv-" + id]; V.rvShown = null;
  } else {
    const la = lastAnswer(target); if (!la) return; la.score = n; la.scoredAt = new Date().toISOString();
  }
  save(true); render(); window.scrollTo({ top: 0 });
}
document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id; const L = lessonOf(V.lessonId);
  if (act === "tab") { V.lessonId = id; V.pick = null; history.replaceState(null, "", "#" + id); render(); window.scrollTo({ top: 0 }); }
  else if (act === "pick") { V.pick = b.dataset.i === "end" ? null : Number(b.dataset.i); render(); }
  else if (act === "read") { D.read[id] = true; save(); render(); window.scrollTo({ top: 0 }); }
  else if (act === "submit") {
    const el = document.getElementById("ans-" + id); const text = ((el && el.value) || "").trim();
    if (!text) { V.msg[id] = "先写几句再交。"; render(); return; }
    V.msg[id] = ""; const a = D.attempts[id] || { answers: [] }; a.answers.push({ text, at: new Date().toISOString() }); D.attempts[id] = a;
    delete D.drafts["ans-" + id]; V.revising[id] = false; V.pick = BYID[id].order; save(true); render();
  }
  else if (act === "rv-submit") {
    const el = document.getElementById("rv-" + id); const text = ((el && el.value) || "").trim();
    if (!text) return; D.drafts["rv-" + id] = text; V.rvShown = id; save(true); render();
  }
  else if (act === "score") record(id, Number(b.dataset.n));
  else if (act === "copy") {
    let text = "";
    if (id.startsWith("lesson-")) text = lessonPrompt(lessonOf(id.slice(7)));
    else if (id.startsWith("g-")) { const q = BYID[id.slice(2)]; const la = lastAnswer(q.id); text = gradePrompt({ text: q.text, key: q.key, errors: q.errors, answer: la ? la.text : "" }); }
    else if (id.startsWith("r-")) { const r = D.review[id.slice(2)]; text = gradePrompt({ text: r.题, key: r.要点, answer: D.drafts["rv-" + r.id] || "" }); }
    const ok = await copyText(text); V.copied[id] = ok; V.showPrompt[id] = !ok || V.showPrompt[id]; render();
    if (!ok) { const t = document.getElementById("pr-" + id); if (t) { t.focus(); t.select(); } }
  }
  else if (act === "next") { V.pick = null; render(); window.scrollTo({ top: 0 }); }
  else if (act === "revise") { V.revising[id] = true; if (!D.drafts["ans-" + id]) { const la = lastAnswer(id); if (la) D.drafts["ans-" + id] = la.text; } render(); }
  else if (act === "cancel-revise") { V.revising[id] = false; render(); }
  else if (act === "skip-opt") { D.attempts[id] = { answers: [], skipped: true }; save(true); V.pick = null; render(); }
  else if (act === "close") {
    const v = k => ((document.getElementById(k) || {}).value || "").trim();
    D.notes[id] = { 复盘: v("note-fp-" + id), 大图: v("note-big-" + id) };
    const Lc = lessonOf(id); const tom = addDays(today(), 1);
    const items = Lc.selftest.map(s => ({ id: s.id, 课: Lc.num, 题: s.q, 要点: s.key }));
    Lc.questions.filter(q => !q.optional && firstScore(q.id) !== null && firstScore(q.id) < PASS).forEach(q => items.push({ id: q.id, 课: Lc.num, 题: q.text, 要点: q.key }));
    items.forEach(it => { if (!D.review[it.id]) D.review[it.id] = Object.assign(it, { 档: 0, 下次到期: tom, 状态: "在学", 记录: [] }); });
    D.done[id] = { at: today() }; delete D.drafts["note-fp-" + id]; delete D.drafts["note-big-" + id];
    save(true); V.pick = null; render(); window.scrollTo({ top: 0 });
  }
  else if (act === "reset") {
    if (b.dataset.armed) { D = blank(); save(true); V.pick = null; b.textContent = "清空我的记录"; delete b.dataset.armed; render(); }
    else { b.dataset.armed = "1"; b.textContent = "再点一次确认清空"; setTimeout(() => { if (b.dataset.armed) { delete b.dataset.armed; b.textContent = "清空我的记录"; } }, 4000); }
  }
});
document.addEventListener("input", ev => { const t = ev.target; if (t.tagName === "TEXTAREA" && t.id && !t.readOnly) { D.drafts[t.id] = t.value; save(); } });
render();
})();
</script>
